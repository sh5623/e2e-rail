name: ci
on: [push, pull_request]
jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: "${{ matrix.node }}" }
      - run: npm ci
      - run: npm test
  contract:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
        playwright: [locked]
        include:
          # the floor in peerDependencies (and assertPlaywrightSupported): the first release with --test-list
          - node: 20
            playwright: "1.56.0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: "${{ matrix.node }}" }
      - run: npm ci
      - if: matrix.playwright != 'locked'
        run: npm i --no-save @playwright/test@${{ matrix.playwright }}
      - run: npm run test:contract
